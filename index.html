<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Notes Sharing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DevOps Notes Sharing</h1>
            <p>Share and manage your DevOps insights</p>
        </header>
        <form id="note-form">
            <input type="text" id="note-title" placeholder="Note Title" required>
            <textarea id="note-content" placeholder="Note Content" required></textarea>
            <button type="submit">Add Note</button>
        </form>
        <div id="notes-container">
            <!-- Notes will be displayed here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
